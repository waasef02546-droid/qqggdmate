# PRE-SAGA Data Sharing Policy examples

schema_version: "pre-saga-policy-v1"

default_decision: "deny"

policies:
  - policy_id: "policy-calendar-availability-bob-v1"
    description: "Allow Bob's scheduler agent to read Alice's calendar availability for meeting scheduling."
    owner_aid: "alice@mail.com:calendar_agent"
    requester_selector:
      type: "aid_exact"
      value: "bob@mail.com:scheduler_agent"
    data_scope:
      data_classes:
        - "calendar"
      data_subclasses:
        - "availability"
      record_selectors:
        - type: "prefix"
          value: "cal-"
    purpose:
      allowed:
        - "schedule_meeting"
    validity:
      not_before: "2026-07-15T00:00:00Z"
      not_after: "2026-07-22T00:00:00Z"
    limits:
      max_uses: 5
      max_records: 20
      allow_bulk_export: false
    version_constraints:
      min_version: 1
      max_version: 3
    decision:
      effect: "allow"
    obligations:
      audit: true
      redact_fields:
        - "event_description"
        - "participant_notes"

  - policy_id: "policy-mail-subject-research-group-v1"
    description: "Allow research agents to access mail subjects and summaries, not mail bodies."
    owner_aid: "alice@mail.com:mail_agent"
    requester_selector:
      type: "aid_pattern"
      value: "*@mail.com:research_agent"
    data_scope:
      data_classes:
        - "mail"
      data_subclasses:
        - "subject"
        - "summary"
      record_selectors:
        - type: "prefix"
          value: "mail-"
    purpose:
      allowed:
        - "literature_coordination"
        - "collaborative_writing"
    validity:
      not_before: "2026-07-15T00:00:00Z"
      not_after: "2026-08-15T00:00:00Z"
    limits:
      max_uses: 30
      max_records: 100
      allow_bulk_export: false
    version_constraints:
      min_version: 1
      max_version: 10
    decision:
      effect: "allow"
    obligations:
      audit: true
      redact_fields:
        - "mail_body"
        - "attachments"

  - policy_id: "policy-memory-project-summary-v1"
    description: "Allow project manager agent to access selected memory summaries."
    owner_aid: "alice@mail.com:memory_agent"
    requester_selector:
      type: "aid_exact"
      value: "emma@mail.com:project_manager_agent"
    data_scope:
      data_classes:
        - "memory"
      data_subclasses:
        - "project_summary"
      record_selectors:
        - type: "tag"
          value: "pre-saga"
    purpose:
      allowed:
        - "project_tracking"
    validity:
      not_before: "2026-07-15T00:00:00Z"
      not_after: "2026-07-30T00:00:00Z"
    limits:
      max_uses: 10
      max_records: 50
      allow_bulk_export: true
    version_constraints:
      min_version: 2
      max_version: 4
    decision:
      effect: "allow"
    obligations:
      audit: true
      watermark: true

  - policy_id: "policy-deny-mail-body-default-v1"
    description: "Explicitly deny mail body access to non-owner agents."
    owner_aid: "alice@mail.com:mail_agent"
    requester_selector:
      type: "aid_pattern"
      value: "*"
    data_scope:
      data_classes:
        - "mail"
      data_subclasses:
        - "body"
      record_selectors:
        - type: "prefix"
          value: "mail-"
    purpose:
      allowed:
        - "*"
    validity:
      not_before: "2026-07-15T00:00:00Z"
      not_after: "2027-07-15T00:00:00Z"
    limits:
      max_uses: 0
      max_records: 0
      allow_bulk_export: false
    version_constraints:
      min_version: 1
      max_version: 999999
    decision:
      effect: "deny"
      reason: "mail_body_requires_explicit_owner_approval"
    obligations:
      audit: true

example_requests:
  - request_id: "req-allow-calendar-001"
    expected_decision: "allow"
    owner_aid: "alice@mail.com:calendar_agent"
    requester_aid: "bob@mail.com:scheduler_agent"
    data_class: "calendar"
    data_subclass: "availability"
    record_id: "cal-2026-07-15-001"
    purpose: "schedule_meeting"
    version: 3

  - request_id: "req-deny-purpose-001"
    expected_decision: "deny"
    expected_reason: "purpose_mismatch"
    owner_aid: "alice@mail.com:calendar_agent"
    requester_aid: "bob@mail.com:scheduler_agent"
    data_class: "calendar"
    data_subclass: "availability"
    record_id: "cal-2026-07-15-001"
    purpose: "expense_report"
    version: 3

  - request_id: "req-deny-class-001"
    expected_decision: "deny"
    expected_reason: "data_class_denied"
    owner_aid: "alice@mail.com:calendar_agent"
    requester_aid: "bob@mail.com:scheduler_agent"
    data_class: "mail"
    data_subclass: "body"
    record_id: "mail-2026-07-15-001"
    purpose: "schedule_meeting"
    version: 1

  - request_id: "req-deny-version-001"
    expected_decision: "deny"
    expected_reason: "version_out_of_bounds"
    owner_aid: "alice@mail.com:calendar_agent"
    requester_aid: "bob@mail.com:scheduler_agent"
    data_class: "calendar"
    data_subclass: "availability"
    record_id: "cal-2026-07-15-001"
    purpose: "schedule_meeting"
    version: 4
